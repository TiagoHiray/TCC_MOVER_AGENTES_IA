sentido: horário
velocidade_cruzeiro_kmh: 30.0
observacoes:
- 'Rota tirada só do mapa do CARLA (mapa_final.xodr): itinerário de 12 vias e 3 conectores de junção (285, 292, 305), no centro das faixas e no sentido de tráfego (horário).'
- 'Nenhuma gravação de celular entra no plano: as lombadas são pontos fixos do config/autonomo.yaml, e as faixas de pedestre e os portões vêm do OSM do campus.'
- OSM projetado no mapa pela georreferência do .xodr (mediana 78.8 m até a via mais próxima).
